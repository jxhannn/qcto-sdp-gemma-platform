<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 180" role="img" aria-labelledby="title desc">
  <title id="title">QCTO PathFinder logo</title>
  <desc id="desc">A custom QCTO PathFinder logo with a navy and orange map pin icon and wordmark.</desc>
  <defs>
    <linearGradient id="pinOrange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a3d"/>
      <stop offset="0.55" stop-color="#f05a28"/>
      <stop offset="1" stop-color="#c9431d"/>
    </linearGradient>
    <linearGradient id="pinNavy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#082b5f"/>
      <stop offset="1" stop-color="#0b1f38"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#082b5f" flood-opacity="0.15"/>
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <path d="M84 18C48 18 20 46 20 83c0 49 64 81 64 81s64-32 64-81c0-37-28-65-64-65Z" fill="url(#pinOrange)"/>
    <path d="M84 18c-29 0-53 18-61 45 31-11 58-4 78 14 20 19 34 47 42 76 16-14 5-28 5-70 0-37-28-65-64-65Z" fill="url(#pinNavy)"/>
    <path d="M49 126c18-36 44-62 78-77" stroke="#ffd2ad" stroke-width="7" stroke-linecap="round" opacity="0.95"/>
    <circle cx="83" cy="83" r="8" fill="#0b1f38" opacity="0.95"/>
    <circle cx="112" cy="111" r="5" fill="#0b1f38" opacity="0.95"/>
    <circle cx="65" cy="112" r="4" fill="#0b1f38" opacity="0.95"/>
    <path d="M49 38 55 52 69 58 55 64 49 78 43 64 29 58 43 52Z" fill="#ffd15c"/>
    <path d="M77 28 82 39 93 44 82 49 77 60 72 49 61 44 72 39Z" fill="#ffd15c"/>
  </g>

  <g font-family="Segoe UI, Aptos, Arial, sans-serif" font-weight="800">
    <text x="182" y="76" font-size="60" fill="#082b5f" letter-spacing="1">QCTO</text>
    <text x="182" y="132" font-size="54" fill="#f05a28" letter-spacing="0">PathFinder</text>
  </g>
</svg>
