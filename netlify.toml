[build]
  publish = "."
  functions = "netlify/functions"

[dev]
  publish = "."
  functions = "netlify/functions"
  port = 8888

[functions]
  included_files = ["netlify/functions/data/providers_compact.json"]


# ============================================================================
# Caching headers (added by Kiro review - review/kiro-fixes-preview branch)
# ============================================================================

# Versioned assets (query-string versioned via ?v=NN) - cache for 1 year
# Cache-busting is handled by the ?v= query string that the HTML references.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Explore data JSON - cache for 1 day (it is versioned via filename)
[[headers]]
  for = "/assets/data/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

# CSS and JS at the root - cache but revalidate
[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/styles.min.css"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/script.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# HTML - never cache (so deploys are instant)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=()"

# robots.txt / sitemap.xml
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=86400"
